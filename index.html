<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Smart Lost &amp; Found</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <h1>
          Lost something on campus?<br>
          Let the system find it.
        </h1>
        <p>
          Report a lost or found item once. We compare category, colour,
          description, location and date, and tell you when something looks like
          yours.
        </p>
        <div class="row">
          <a class="btn tag" href="report.html">Report an item</a>
          <a class="btn ghost" href="search.html">Search items</a>
        </div>
      </section>

      <div class="stats" id="stats"></div>
      <h2>Recently reported</h2>
      <div class="grid" id="recent"></div>
    </main>

    <script src="js/app.js"></script>
    <script>
      layout('index.html');

      const it = DB.get('items', []);
      const ok = it.filter((i) => i.status === 'approved');

      $('#stats').innerHTML = [
        ['Lost reports', it.filter((i) => i.type === 'lost').length],
        ['Found reports', it.filter((i) => i.type === 'found').length],
        ['Returned', it.filter((i) => i.status === 'returned').length],
        ['Users', DB.get('users', []).length],
      ]
        .map((s) => `<div class="stat"><b>${s[1]}</b>${s[0]}</div>`)
        .join('');

      $('#recent').innerHTML =
        ok
          .slice(-6)
          .reverse()
          .map((i) => itemCard(i))
          .join('') || '<div class="empty">No approved reports yet.</div>';
    </script>
  </body>
</html>
