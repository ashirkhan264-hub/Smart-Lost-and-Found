<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Smart Lost & Found</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"></head><body>
<main class="wrap"><div class="pagehead"><div class="crumb">Home / Admin</div><h1>Admin dashboard</h1><p>Verify reports, manage users and see statistics.</p></div>
<div class="tabs" id="tabs"></div><div id="view"><div class="empty">Loading...</div></div></main>
<script src="js/app.js"></script>
<script>
const API='http://localhost:5000/api';
layout('admin.html');
const admin=need('admin');
const H={'x-admin-email':admin.email,'Content-Type':'application/json'};
let T='reports', ITEMS=[], USERS=[], CLAIMS=[], STATS=null, FILTER='all';
const TABS=[['stats','Statistics'],['reports','Reports'],['claims','Claims'],['users','Users']];

async function api(path,opt={}){
  try{
    const r=await fetch(API+path,{...opt,headers:H});
    const d=await r.json();
    if(!r.ok){toast(d.message||'Error');return null}
    return d;
  }catch(e){toast('Cannot reach server. Is node server.js running?');return null}
}
async function refresh(){
  const [i,u,s,c]=await Promise.all([api('/admin/items'),api('/admin/users'),api('/admin/stats'),api('/admin/claims')]);
  ITEMS=i||[];USERS=u||[];STATS=s;CLAIMS=c||[];draw();
}
async function setStatus(id,status){ if(await api('/admin/items/'+id,{method:'PUT',body:JSON.stringify({status})})){toast('Report '+status);refresh()} }
async function delItem(id){ if(!confirm('Delete this report permanently?'))return; if(await api('/admin/items/'+id,{method:'DELETE'})){toast('Report deleted');refresh()} }
async function setClaim(id,status){ if(await api('/admin/claims/'+id,{method:'PUT',body:JSON.stringify({status})})){toast('Claim '+status);refresh()} }
async function blockUser(id,b){ if(await api('/admin/users/'+id+'/block',{method:'PUT',body:JSON.stringify({blocked:b})})){toast(b?'User blocked':'User unblocked');refresh()} }
async function delUser(id){ if(!confirm('Remove this user?'))return; if(await api('/admin/users/'+id,{method:'DELETE'})){toast('User removed');refresh()} }

function draw(){
  $('#tabs').innerHTML=TABS.map(t=>`<button class="btn ${T===t[0]?'':'ghost'}" onclick="T='${t[0]}';draw()">${t[1]}${t[0]==='reports'&&ITEMS.filter(i=>i.status==='pending').length?` (${ITEMS.filter(i=>i.status==='pending').length} pending)`:''}${t[0]==='claims'&&CLAIMS.filter(c=>c.status==='pending').length?` (${CLAIMS.filter(c=>c.status==='pending').length} pending)`:''}</button>`).join('');
  const v=$('#view');
  if(T==='stats'&&STATS){
    const s=STATS,t=Math.max(1,s.lost+s.found),mx=Math.max(1,...s.categories.map(c=>c.n));
    v.innerHTML=`<div class="stats">${[['Total reports',s.total],['Pending verification',s.pending],['Visible in search',s.approved],['Returned',s.returned],['Users',s.users]].map(x=>`<div class="stat"><b>${x[1]}</b>${x[0]}</div>`).join('')}</div>
    <div class="cols"><div class="box"><h3>Reports by category</h3>${s.categories.map(c=>`<div>${esc(c.category)} (${c.n})<div class="bar" style="width:${c.n/mx*100}%"></div></div>`).join('')||'<div class="empty">No data yet</div>'}</div>
    <div class="box"><h3>Lost vs found</h3><div class="donut" style="background:conic-gradient(var(--lost) 0 ${s.lost/t*100}%,var(--found) ${s.lost/t*100}% 100%)"></div><p class="meta" style="text-align:center">Lost ${s.lost} (red) | Found ${s.found} (teal)</p></div></div>`;
  }
  if(T==='reports'){
    const list=ITEMS.filter(i=>FILTER==='all'||i.status===FILTER);
    v.innerHTML=`<div class="toolbar"><b>${list.length} report(s)</b><select onchange="FILTER=this.value;draw()">${['all','pending','approved','rejected','returned'].map(f=>`<option value="${f}" ${FILTER===f?'selected':''}>${f==='all'?'All statuses':f}</option>`).join('')}</select></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Type</th><th>Reported by</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(i=>`<tr><td><b>${esc(i.title)}</b><br><span class="meta">${esc(i.category)}, ${esc(i.color)}, ${esc(i.location)}, ${String(i.item_date).slice(0,10)}</span><br><span class="meta">${esc(i.description)}</span></td>
    <td><span class="badge b-${i.type}">${i.type}</span></td><td>${esc(i.owner_email)}</td><td><span class="badge s-${i.status}">${i.status}</span></td><td>
    ${i.status==='pending'?`<button class="btn sm tag" onclick="setStatus(${i.id},'approved')">Approve</button> <button class="btn sm ghost" onclick="setStatus(${i.id},'rejected')">Reject</button> `:''}${i.status==='approved'?`<button class="btn sm" onclick="setStatus(${i.id},'returned')">Mark returned</button> `:''}<button class="btn sm red" onclick="delItem(${i.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No reports.</td></tr>'}</tbody></table></div>`;
  }
  if(T==='claims')v.innerHTML=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Claimed by</th><th>Proof of ownership</th><th>Status</th><th>Actions</th></tr></thead><tbody>${CLAIMS.map(c=>`<tr><td><b>${esc(c.title)}</b><br><span class="meta">${esc(c.type)} report by ${esc(c.owner_email)}</span>${c.source_title?`<br><span class="meta">Matched ${esc(c.source_type)} report: ${esc(c.source_title)}</span>`:''}</td><td>${esc(c.claimed_by)}<br><span class="meta">${String(c.created_at).slice(0,10)}</span></td><td>${esc(c.message)}</td><td><span class="badge s-${c.status}">${c.status}</span></td><td>${c.status==='pending'?`<button class="btn sm tag" onclick="setClaim(${c.id},'approved')">Approve claim</button> <button class="btn sm ghost" onclick="setClaim(${c.id},'rejected')">Reject</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No claim requests yet.</td></tr>'}</tbody></table></div>`;
  if(T==='users')v.innerHTML=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead><tbody>${USERS.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}${u.blocked?' (blocked)':''}</td><td>${u.role==='admin'?'':`<button class="btn sm ghost" onclick="blockUser(${u.id},${u.blocked?'false':'true'})">${u.blocked?'Unblock':'Block'}</button> <button class="btn sm red" onclick="delUser(${u.id})">Remove</button>`}</td></tr>`).join('')}</tbody></table></div>`;
}
refresh();
</script></body></html>
